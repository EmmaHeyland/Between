<title>Knack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --desk:#E4DFD1; --bg:#F4F1E8; --surface:#FCFAF5; --raise:#FFFFFF; --ink:#211F18; --ink-2:#3B382E; --muted:#6D6858; --line:#E3DDCE; --line-2:#D5CEBB;
  --gold:#D19F32; --gold-ink:#211F18; --gold-text:#8A6414; --gold-soft:#F3E7C6;
  --logo-bar:#211F18;
  --on-bad:#FCFAF5; --good:#3C7A4B; --good-soft:#E2EEDF; --warn:#9C5F12; --warn-soft:#F8E9CF; --bad:#A8412E; --bad-soft:#F6E1DA;
  --frame:#211F18; --shadow:0 40px 80px -40px rgba(33,31,24,.5);
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --desk:#0F0E0A; --bg:#1A1914; --surface:#211F18; --raise:#2A271F; --ink:#EDE8DA; --ink-2:#D6D0BF; --muted:#A39D8A; --line:#35322A; --line-2:#48443A;
    --gold:#D6A83E; --gold-ink:#211F18; --gold-text:#E2B955; --gold-soft:#3A3120;
    --logo-bar:#EDE8DA;
    --on-bad:#211F18; --good:#7DBE8B; --good-soft:#1F3024; --warn:#E3A857; --warn-soft:#3A2C17; --bad:#E8826E; --bad-soft:#3B211B;
    --frame:#000; --shadow:0 40px 80px -40px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#0F0E0A; --bg:#1A1914; --surface:#211F18; --raise:#2A271F; --ink:#EDE8DA; --ink-2:#D6D0BF; --muted:#A39D8A; --line:#35322A; --line-2:#48443A;
  --gold:#D6A83E; --gold-ink:#211F18; --gold-text:#E2B955; --gold-soft:#3A3120;
  --logo-bar:#EDE8DA;
  --on-bad:#211F18; --good:#7DBE8B; --good-soft:#1F3024; --warn:#E3A857; --warn-soft:#3A2C17; --bad:#E8826E; --bad-soft:#3B211B;
  --frame:#000; --shadow:0 40px 80px -40px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

html,body{height:100%}
body{padding:0;margin:0;overflow:hidden;background:var(--bg)}
.stage,.phone{height:100%}
.app{position:relative;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.topnav{display:none}
.only-d{display:none}
.detail,.main{display:flex;flex-direction:column;gap:18px}

/* bars */
.bar{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;background:var(--bg);min-height:58px}
.bar.line{border-bottom:1px solid var(--line)}
.bar h1{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandrow{display:flex;align-items:center;gap:8px;flex:1}
.brandrow .logo{height:22px;width:auto}
.brandrow b{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:-.05em;line-height:1}
.logo{display:block}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn:hover{background:var(--line)}
.where{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:4px}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 28px;display:flex;flex-direction:column;gap:18px}
.screen>*{flex-shrink:0}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 12px}
.tab{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 2px;position:relative}
.tab[aria-current="true"]{color:var(--ink)}
.tab[aria-current="true"] svg{stroke:var(--ink);stroke-width:2.2}
.tab .dot{position:absolute;top:3px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--gold);color:var(--gold-ink);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:17px;height:17px}
svg.star{width:13px;height:13px;fill:var(--gold);flex:none}

/* explore */
.greet{margin:6px 0 0;color:var(--muted);font-weight:500}
.hello{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.035em;line-height:1.02;margin:2px 0 0;text-wrap:balance}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:0 12px;color:var(--muted)}
.search input{border:0;background:none;outline:none;padding:13px 0;flex:1;min-width:0;color:var(--ink)}
.cats{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:70px;background:none;border:0;display:grid;justify-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);padding:0}
.cat .ci{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.cat[aria-pressed="true"]{color:var(--ink)}
.cat[aria-pressed="true"] .ci{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.trustline{display:flex;align-items:center;gap:8px;background:var(--gold-soft);border:0;border-radius:12px;padding:11px 12px;font-size:13px;text-align:left;width:100%;color:var(--ink)}
.trustline svg{color:var(--gold-text)}
.trustline u{margin-left:auto;font-weight:700;text-decoration:none;color:var(--gold-text);white-space:nowrap}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:-8px}
.sec h2{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}
.sec span{font-size:13px;color:var(--muted)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--raise)}
.thumb{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;color:#FCFAF5;flex:none;background:var(--c)}
.thumb svg{width:26px;height:26px;stroke-width:1.7}
.rt{font-weight:600;font-size:15px;line-height:1.25;margin:0}
.rm{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.rm .r{display:inline-flex;align-items:center;gap:3px;color:var(--ink);font-weight:600}
.rp{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}
.rp small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px}
.badge.new{background:var(--gold);color:var(--gold-ink)}
.badge.you{background:var(--line);color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:32px 12px}

/* listing */
.band{margin:-4px -16px 0;height:170px;background:var(--c);display:grid;place-items:center;color:rgba(252,250,245,.9);position:relative;overflow:hidden}
.band svg{width:64px;height:64px;stroke-width:1.4}
.band::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(to top,rgba(0,0,0,.18),transparent)}
.band .cattag{position:absolute;left:16px;bottom:12px;z-index:1;color:#FCFAF5;font-size:12px;font-weight:700;background:rgba(0,0,0,.28);padding:4px 8px;border-radius:7px}
.big{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:-.03em;line-height:1.05;margin:0;text-wrap:balance}
.who{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#FCFAF5;flex:none;background:var(--c)}
.av.lg{width:62px;height:62px;font-size:20px}
.av.sm{width:36px;height:36px;font-size:12px}
.who .n{font-weight:700;display:flex;align-items:center;gap:5px}
.who .n svg{color:var(--good)}
.who .s{font-size:13px;color:var(--muted)}
.who .grow{flex:1;min-width:0}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);padding:12px 0;border-block:1px solid var(--line)}
.facts b{color:var(--ink)}
.facts span{display:inline-flex;align-items:center;gap:4px}
.lbl{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.01em;margin:4px 0 -8px}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{border:1.5px solid var(--line-2);background:var(--surface);border-radius:11px;padding:9px 12px;font-weight:600;font-size:13.5px}
.slot[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.reviews{display:grid;gap:0}
.review{display:grid;gap:3px;padding:12px 0;border-top:1px solid var(--line)}
.review:first-child{border-top:0;padding-top:0}
.review .rh{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.review .rh span{color:var(--muted);font-weight:500}
.review p{margin:0;font-size:14px}
.stars{display:inline-flex;gap:1px}
.buybar{position:sticky;bottom:-28px;margin:auto -16px -28px;padding:12px 16px 14px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
.buybar .p{flex:1;font-variant-numeric:tabular-nums}
.buybar .p b{display:block;font-size:18px}
.buybar .p span{font-size:12px;color:var(--muted)}
.buybar .btn{width:auto;flex:none;padding-inline:18px}
.cta{position:sticky;bottom:-28px;margin:auto -16px -28px;padding:12px 16px 14px;background:var(--bg);border-top:1px solid var(--line);display:grid;gap:8px}

.btn{border:0;border-radius:13px;padding:14px 16px;font-weight:700;font-size:15px;background:var(--gold);color:var(--gold-ink);width:100%;display:flex;justify-content:center;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.04)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.btn.ghost{background:none;color:var(--muted);font-weight:600;padding:10px}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.btn.outline-danger{background:none;color:var(--bad);border:1px solid var(--line-2)}
.btn.sim{background:none;border:1.5px dashed var(--line-2);color:var(--muted);font-weight:600;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.smallbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:7px 11px;font-weight:600;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.smallbtn.p{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.smallbtn.sim{border-style:dashed;color:var(--muted)}

.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.lines{display:grid;gap:9px;font-variant-numeric:tabular-nums}
.line{display:flex;justify-content:space-between;font-size:14px}
.line .m{color:var(--muted)}
.line.tot{border-top:1px solid var(--line);padding-top:10px;font-weight:700;font-size:16px}
.pay{display:grid;gap:8px}
.pay label,.radios label{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:12px;font-weight:600;font-size:14px}
.pay label:has(input:checked),.radios label:has(input:checked){border-color:var(--ink)}
.pay input,.radios input{accent-color:var(--ink);width:18px;height:18px}
.radios{display:grid;gap:8px}
.escrow{display:flex;gap:12px;border-left:3px solid var(--gold);padding:4px 0 4px 12px;font-size:13.5px}
.escrow b{display:block;font-size:14.5px;margin-bottom:2px}
.fine{font-size:12.5px;color:var(--muted);margin:0}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:7px;padding:3px 8px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.held{background:var(--gold-soft);color:var(--gold-text)}
.pill.done,.pill.await{background:var(--warn-soft);color:var(--warn)}
.pill.released,.pill.reviewed,.pill.paid,.pill.live{background:var(--good-soft);color:var(--good)}
.pill.dispute{background:var(--bad-soft);color:var(--bad)}
.pill.cancelled,.pill.hidden{background:var(--line);color:var(--muted)}

.timeline{list-style:none;margin:0;padding:0;display:grid}
.timeline li{display:grid;grid-template-columns:26px 1fr;gap:12px;position:relative;padding-bottom:16px}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline li.ok::before{background:var(--good)}
.tdot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);background:var(--surface);color:var(--muted);font-size:12px;font-weight:700}
.ok .tdot{background:var(--good);border-color:var(--good);color:var(--surface)}
.now .tdot{border-color:var(--gold);color:var(--gold-text);box-shadow:0 0 0 4px var(--gold-soft)}
.bad .tdot{border-color:var(--bad);color:var(--bad)}
.timeline b{display:block;font-size:14px}
.timeline span{font-size:12.5px;color:var(--muted)}
.note{border-radius:13px;padding:12px;font-size:13.5px}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}

/* earn */
.earn{background:var(--gold);color:var(--gold-ink);border-radius:20px;padding:18px;display:grid;gap:14px}
.earn .k{font-size:13px;font-weight:600;opacity:.75}
.earn .v{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.earn .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid rgba(33,31,24,.2);padding-top:12px}
.earn .row3 b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.earn .row3 span{font-size:12px;opacity:.75}
.toggle{display:flex;align-items:center;gap:12px}
.toggle .txt{flex:1}
.toggle b{display:block;font-size:14.5px}
.toggle span{font-size:12.5px;color:var(--muted)}
.switch{width:48px;height:28px;border-radius:999px;border:0;background:var(--line-2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#FCFAF5;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--gold)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.grid{display:grid;grid-template-columns:auto repeat(7,1fr);gap:5px;align-items:center;font-size:11px}
.grid .h{text-align:center;color:var(--muted);font-weight:700}
.grid .r{color:var(--muted);font-weight:600;padding-right:4px}
.cell{aspect-ratio:1;border-radius:7px;border:1px solid var(--line-2);background:transparent;padding:0}
.cell[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.paused .cell[aria-pressed="true"]{background:var(--line-2);border-color:var(--line-2)}
.jobs>*+*{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.jrow{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center}
.jrow .t{font-weight:600;font-size:14px}
.jrow .s{font-size:12.5px;color:var(--muted)}

/* forms */
form.f{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:700}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:11px 12px;width:100%}
.field textarea{min-height:88px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.starpick{display:flex;gap:6px}
.starpick button{background:none;border:0;padding:2px}
.starpick svg{width:34px;height:34px;fill:var(--line-2)}
.starpick button[aria-pressed="true"] svg{fill:var(--gold)}
.tagrow{display:flex;flex-wrap:wrap;gap:8px}
.tagbtn{border:1.5px solid var(--line-2);background:var(--surface);border-radius:10px;padding:7px 11px;font-weight:600;font-size:13px}
.tagbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}

/* inbox & chat */
.convo{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 14px;border-top:1px solid var(--line)}
.convo:first-child{border-top:0}
.convo .av{width:48px;height:48px}
.convo .nm{font-weight:700;font-size:15px}
.convo .ab{font-size:12px;color:var(--muted)}
.convo .lm{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.convo.unread .lm{color:var(--ink);font-weight:600}
.convo .tm{font-size:12px;color:var(--muted);text-align:right;display:grid;gap:6px;justify-items:end}
.convo .ub{width:10px;height:10px;border-radius:50%;background:var(--gold)}
.chat{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.msg{max-width:80%;padding:9px 12px;border-radius:18px;font-size:14.5px;line-height:1.35;word-wrap:break-word}
.msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}
.msg .at{display:block;font-size:10.5px;opacity:.6;margin-top:3px;text-align:right}
.msg.sys{align-self:center;max-width:92%;background:var(--gold-soft);color:var(--ink);border-radius:12px;font-size:12.5px;text-align:center;display:flex;gap:6px;align-items:flex-start}
.msg.sys svg{color:var(--gold-text);margin-top:1px}
.day{align-self:center;font-size:11.5px;color:var(--muted);font-weight:600;margin:6px 0}
.typing{align-self:flex-start;font-size:12.5px;color:var(--muted);padding:4px 6px}
.composer{position:sticky;bottom:-28px;margin:auto -16px -28px;padding:10px 12px 14px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.composer input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line-2);border-radius:22px;padding:11px 14px;outline:none}
.composer input:focus{border-color:var(--ink)}
.sendbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;flex:none}
.chathead{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.chathead .nm{font-weight:700;font-size:15.5px;line-height:1.2}
.chathead .ab{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* profile & settings */
.plist{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pitem{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:13px 14px;text-align:left;font-size:14.5px;font-weight:500}
.pitem:first-child{border-top:0}
.pitem .grow{flex:1}
.pitem .val{color:var(--muted);font-size:13.5px}
.pitem.red{color:var(--bad);font-weight:600}
.pitem svg.i{color:var(--muted)}
.pitem.red svg.i{color:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13px;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grouplbl{font-size:13px;font-weight:700;color:var(--muted);margin:4px 0 -10px 4px}
details.info{border-top:1px solid var(--line);padding:0 14px}
details.info:first-child{border-top:0}
details.info summary{padding:13px 0;font-weight:500;font-size:14.5px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.info summary::-webkit-details-marker{display:none}
details.info summary::after{content:"+";color:var(--muted)}
details.info[open] summary::after{content:"–"}
details.info ul{margin:0 0 14px;padding-left:18px;font-size:13.5px;color:var(--muted);display:grid;gap:6px}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700}
.steps b{display:block}
.steps span{font-size:13.5px;color:var(--muted)}
.dellist{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14px}
.deleted{flex:1;display:grid;place-content:center;justify-items:center;text-align:center;gap:14px;padding:32px}
.deleted .logo{height:48px;width:auto}
.deleted h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.03em;margin:0}
.deleted p{margin:0;color:var(--muted);max-width:30ch}

.toast{position:absolute;left:16px;right:16px;bottom:82px;background:var(--ink);color:var(--bg);border-radius:13px;padding:12px 14px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .25s ease-out;z-index:5}
.toast[hidden]{display:none}
@keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}

.splash{position:absolute;inset:0;z-index:20;background:#211F18;color:#EDE8DA;display:grid;place-content:center;justify-items:center;gap:18px;animation:splashOut .45s ease 1.1s forwards;--logo-bar:#EDE8DA;--gold:#D6A83E}
.splash .lockup{display:flex;align-items:center;gap:16px}
.splash .logo{height:54px;width:auto}
.splash b{font-family:var(--display);font-weight:800;font-size:60px;letter-spacing:-.05em;line-height:.9}
.splash p{margin:0;font-family:var(--display);font-weight:500;font-size:18px;letter-spacing:-.01em;color:#D6A83E}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.splash{display:none}}

.search input,.field input,.field select,.field textarea,.composer input{font-size:16px}
@media (min-width:900px) and (pointer:fine){
  .topnav{display:flex;align-items:center;gap:8px;padding:12px max(24px,calc((100% - 1080px)/2));background:var(--surface);border-bottom:1px solid var(--line)}
  .tn-brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;margin-right:24px;color:var(--ink)}
  .tn-brand .logo{height:24px;width:auto}
  .tn-brand b{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:-.05em;line-height:1}
  .tn-links{display:flex;gap:4px;flex:1}
  .tn-link{display:flex;align-items:center;gap:7px;border:0;background:none;padding:9px 12px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--muted)}
  .tn-link svg.i{width:18px;height:18px}
  .tn-link:hover{color:var(--ink);background:var(--bg)}
  .tn-link[aria-current="true"]{background:var(--bg);color:var(--ink)}
  .tn-link .dot{min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
  .tn-av{border:0;background:none;padding:0;margin-left:8px}
  .tabs{display:none}
  .app{--w:1080px}
  .app[data-v="bookings"],.app[data-v="booking"],.app[data-v="review"],.app[data-v="dispute"],.app[data-v="inbox"],.app[data-v="chat"],.app[data-v="earn"],.app[data-v="add"],.app[data-v="profile"],.app[data-v="del"],.app[data-v="how"],.app[data-v="checkout"]{--w:760px}
  .bar,.screen{padding-inline:max(24px,calc((100% - var(--w))/2))}
  .bar{padding-top:24px;min-height:0}
  .bar.home{display:none}
  .screen{padding-top:16px;padding-bottom:40px;gap:22px}
  .buybar,.cta,.composer{margin:auto 0 -40px;bottom:-40px;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}
  .hello{font-size:50px}
  .greet{font-size:17px}
  .cats{flex-wrap:wrap;margin:0;padding:0;gap:10px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;background:none;border:0;border-radius:0;overflow:visible}
  .cards .row,.cards .row:first-child{grid-template-columns:1fr auto;align-items:start;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:0 0 16px;overflow:hidden;gap:12px 10px}
  .cards .row:hover{border-color:var(--line-2);box-shadow:0 8px 24px -14px rgba(0,0,0,.35)}
  .cards .thumb{grid-column:1/-1;width:100%;height:140px;border-radius:0}
  .cards .thumb svg{width:42px;height:42px}
  .cards .row>div:nth-child(2){padding-left:16px}
  .cards .rp{padding-right:16px}
  .band{margin:0;height:280px;border-radius:22px}
  .detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:48px;align-items:start}
  .only-m{display:none!important}
  .side.only-d{display:block;position:sticky;top:0}
  .sidecard{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}
  .sidecard .p b{font-size:26px;font-variant-numeric:tabular-nums}
  .sidecard .p span{color:var(--muted);font-size:14px;margin-left:4px}
  .sidecard .fine{display:flex;gap:6px;align-items:flex-start}
  .toast{left:50%;right:auto;transform:translateX(-50%);bottom:28px;width:max-content;max-width:90%;animation:none}
}
</style>

</head>
<body>
<div class="stage">
  <div class="phone"><div class="app" id="app">
    <nav class="topnav" id="topnav" aria-label="Main"></nav>
    <header class="bar" id="bar"></header>
    <main class="screen" id="screen"></main>
    <nav class="tabs" id="tabs" aria-label="Main"></nav>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="splash" id="splash" aria-hidden="true">
      <div class="lockup"><svg class="logo" viewBox="0 0 56 64"><rect x="0" y="2" width="11" height="60" rx="2.5" fill="var(--logo-bar)"/><path d="M46 7L22 32l24 25" fill="none" stroke="var(--gold)" stroke-width="10.5" stroke-linejoin="miter"/></svg><b>knack</b></div>
      <p>Got a knack? Get paid.</p>
    </div>
  </div></div>


</div>

function render(scrollTop){
  if(S.deleted){
    $('bar').hidden=true; $('tabs').hidden=true; $('topnav').hidden=true; $('app').dataset.v='deleted';
    $('screen').innerHTML=`<div class="deleted">${LOGO}<h1>Your account is deleted</h1><p>Thanks for using Knack. Your data will be removed within 30 days. You're always welcome back.</p><button class="btn dark" data-a="reset" style="width:auto;padding-inline:22px">Start again (demo)</button></div>`;
    return;
  }
  $('bar').hidden=false; $('tabs').hidden=false; $('topnav').hidden=false;
  const v=view(); $('app').dataset.v=v.name;
  $('screen').innerHTML = R[v.name](v);
  if(v.name==='chat') $('screen').scrollTop=1e6; else if(scrollTop) $('screen').scrollTop=0;
  const cur=tabOf(v.name); const unread=unreadTotal(); const confirm=S.bookings.filter(b=>b.status==='done').length;
  $('tabs').innerHTML=[['explore','Explore','explore'],['bookings','Bookings','cal'],['inbox','Inbox','inbox'],['earn','Earn','wallet'],['profile','Profile','user']].map(([id,n,icn])=>{
    const badge = id==='inbox'&&unread ? `<span class="dot">${unread}</span>` : id==='bookings'&&confirm ? `<span class="dot">${confirm}</span>` : '';
    return `<button class="tab" data-a="tab" data-id="${id}" aria-current="${cur===id}">${ic(icn)}${n}${badge}</button>`;}).join('');
  $('topnav').innerHTML = `<button class="tn-brand" data-a="tab" data-id="explore" aria-label="Knack home">${LOGO}<b>knack</b></button>
    <div class="tn-links">${[['explore','Explore','explore'],['bookings','Bookings','cal'],['inbox','Inbox','inbox'],['earn','Earn','wallet']].map(([id,n,icn])=>{
      const badge = id==='inbox'&&unread ? `<span class="dot">${unread}</span>` : id==='bookings'&&confirm ? `<span class="dot">${confirm}</span>` : '';
      return `<button class="tn-link" data-a="tab" data-id="${id}" aria-current="${cur===id}">${ic(icn)}${n}${badge}</button>`;}).join('')}</div>
    <span class="where">${ic('pin','s')}Enschede</span>
    <button class="iconbtn" data-a="themeFlip" aria-label="Switch to ${isDark()?'light':'dark'} theme">${ic(isDark()?'sun':'moon')}</button>
    <button class="tn-av" data-a="tab" data-id="profile" aria-label="Profile">${av(S.me,'sm')}</button>`;
}

const RISKY=/(\b0?6[\s-]?\d{2}[\s-]?\d{2}[\s-]?\d{2}[\s-]?\d{2}\b|\+31|\btikkie\b|\bwhatsapp\b|\bcash\b|\biban\b|\bNL\d{2}[A-Z]{4})/i;
function autoReply(c,text){
  const t=text.toLowerCase();
  let r = /time|when|tomorrow|today|morgen|later/.test(t) ? 'That works for me! Book the slot in the app so it is confirmed.'
        : /price|cost|€|euro|discount|cheaper/.test(t) ? 'The price in my listing includes everything. Parts are at cost price.'
        : RISKY.test(text) ? "Let's just keep it in Knack, then we're both covered if something goes wrong."
        : /thank|thanks|bedankt|dank/.test(t) ? 'You are welcome! Enjoy.'
        : ['Sounds good!','Sure, no problem.','Great, see you then!',"Okay, I'll keep you posted here."][c.msgs.length%4];
  c.typing=true; if(isOpen(c)) render();
  setTimeout(()=>{ c.typing=false; c.msgs.push({f:'them',t:r,at:now()}); if(isOpen(c)) render(); else { c.unread=(c.unread||0)+1; render(); } },1500);
}
const isOpen = c => view().name==='chat' && view().id===c.id && !S.deleted;

const A = {
  back, tab:d=>tab(d.id),
  reset(){ S=seed(); applyTheme(); render(true); toast('Demo data reset'); },
  cat(d){ S.cat=d.id; render(); },
  how(){ go({name:'how'}); },
  open(d){ go({name:'listing',id:d.id}); },
  slot(d){ S.sel[d.id]=+d.i; const sc=$('screen').scrollTop; render(); $('screen').scrollTop=sc; },
  checkout(d){ go({name:'checkout',id:d.id}); },
  pay(d){
    const l=L(d.id); const id='b'+Date.now();
    S.bookings.push({id,lid:l.id,slot:l.slots[S.sel[l.id]??0],price:l.price,status:'held'});
    S.stack=[{name:'bookings'},{name:'booking',id}]; render(true);
    toast(`Booked. ${eur(l.price+fee(l.price))} is held by Knack`);
  },
  booking(d){ go({name:'booking',id:d.id}); },
  simDone(d){ const b=B(d.id); b.status='done'; b.hours=48; render(true); toast(`${L(b.lid).who} marked the job as done`); },
  cancel(d){ const b=B(d.id); b.status='cancelled'; render(true); toast('Cancelled. Full refund on its way'); },
  confirm(d){ const b=B(d.id); b.status='released'; render(true); toast(`${eur(net(b.price))} released to ${L(b.lid).who}`); },
  review(d){ S.draft={s:5,tags:[]}; go({name:'review',id:d.id}); },
  star(d){ S.draft.t=$('rv')?.value||''; S.draft.s=+d.n; render(); },
  qtag(d){ S.draft.t=$('rv')?.value||''; const t=S.draft.tags||(S.draft.tags=[]); const i=t.indexOf(d.t); i<0?t.push(d.t):t.splice(i,1); render(); },
  sendReview(d){
    const b=B(d.id); const l=L(b.lid); const txt=($('rv').value||'').trim();
    const full=[(S.draft.tags||[]).join(' · '),txt].filter(Boolean).join('. ');
    b.review={s:S.draft.s,t:full}; b.status='reviewed';
    l.reviews.unshift({n:S.me.name,s:S.draft.s,t:full||'No comment',w:'just now'});
    l.count++; l.rating=Math.round(((l.rating*(l.count-1))+S.draft.s)/l.count*10)/10;
    S.stack=[{name:'bookings'},{name:'booking',id:b.id}]; render(true); toast('Review posted');
  },
  dispute(d){ go({name:'dispute',id:d.id}); },
  sendDispute(d){
    const b=B(d.id); const r=document.querySelector('input[name="reason"]:checked');
    b.status='dispute'; b.reason=r?r.value:'';
    S.stack=[{name:'bookings'},{name:'booking',id:b.id}]; render(true); toast('Report sent. Payment frozen');
  },
  chat(d){ go({name:'chat',id:d.id}); },
  msgListing(d){ const l=L(d.id); openChatWith(l.who,l.title,l.id); },
  exam(){ S.exam=!S.exam; render(); toast(S.exam?'Exam week mode on. Succes!':'You can be booked again'); },
  notif(){ S.notif=!S.notif; render(); },
  avail(d){ S.avail[d.k]=S.avail[d.k]?0:1; const sc=$('screen').scrollTop; render(); $('screen').scrollTop=sc; },
  jobDone(d){ const j=S.jobs.find(x=>x.id===d.id); j.status='await'; render(); toast(`Waiting for ${j.client} to confirm`); },
  jobPaid(d){ const j=S.jobs.find(x=>x.id===d.id); j.status='paid'; S.paidOut+=net(j.amount); S.jobsDone++; render(); toast(`${eur(net(j.amount))} paid out to you`); },
  add(){ go({name:'add'}); },
  theme(d){ S.theme=d.id; applyTheme(); render(); },
  themeFlip(){ S.theme=isDark()?'light':'dark'; applyTheme(); render(); },
  del(){ go({name:'del'}); },
  doDelete(){ if(($('delconf').value||'').trim().toUpperCase()!=='DELETE') return; S.deleted=true; render(true); },
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t) return;
  const fn=A[t.dataset.a]; if(fn){ e.preventDefault(); fn(t.dataset,t); }
});
$('app').addEventListener('input',e=>{
  if(e.target.id==='q'){ S.q=e.target.value; $('results').innerHTML=listHTML(); $('cnt').textContent=visible().length+' students'; }
  if(e.target.id==='rv'){ S.draft.t=e.target.value; }
  if(e.target.id==='delconf'){ $('delbtn').disabled = e.target.value.trim().toUpperCase()!=='DELETE'; }
});
$('app').addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='chatform'){
    const c=C(e.target.dataset.id); const inp=$('msg'); const t=inp.value.trim(); if(!t) return;
    c.msgs.push({f:'me',t,at:now()});
    if(RISKY.test(t)) c.msgs.push({f:'sys',t:'Heads-up: payments or deals outside Knack are not protected. Book through the app to keep the money held safely and your review counted.'});
    render(); const ni=$('msg'); if(ni) ni.focus();
    autoReply(c,t);
    return;
  }
  if(e.target.id==='addform'){
    const title=$('a-title').value.trim(); const price=parseFloat($('a-price').value);
    if(!title||!(price>0)) return;
    S.listings.unshift({id:'m'+Date.now(),cat:$('a-cat').value,title,who:S.me.name,mine:true,isNew:true,ini:S.me.ini,col:S.me.col,study:'Industrial Design · UT',
      price,unit:$('a-unit').value,rating:0,count:0,jobs:0,done:'–',reply:'new',desc:$('a-desc').value.trim()||'No description yet.',
      slots:['Mon evening','Wed morning','Sat afternoon'],reviews:[]});
    S.cat='all'; S.q=''; S.stack=[{name:'explore'}]; render(true); toast('Your service is live on Explore');
  }
});
applyTheme();
render(true);
setTimeout(()=>{const sp=$('splash'); if(sp) sp.remove();},1700);
</script>

</body>
</html>
